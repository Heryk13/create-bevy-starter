[package]
name = "create-bevy-starter"
version = "0.1.0"
edition = "2024"
# let chains, which `main.rs` and `scaffold.rs` use, are stable from 1.88
rust-version = "1.88"
description = "Builds a new Bevy game from the bevy-starter template, from a few questions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Heryk13/create-bevy-starter"
readme = "README.md"
keywords = ["bevy", "gamedev", "template", "scaffold", "cli"]
categories = ["command-line-utilities", "game-development"]
# what `cargo install` needs; the rest of the repository is for working on the CLI
include = ["src/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
inquire = "0.9.4"

# the same lints as bevy-starter, less the ones only a Bevy game needs, and the print lints a
# CLI has to break
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
nonstandard_macro_braces = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
# CONTRIBUTING forbids mod.rs (a split module is `prompts.rs` next to `prompts/`), and this
# lint makes the rule hold without review
mod_module_files = "warn"
